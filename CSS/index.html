<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headers simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: darkgreen;
        }

        h3 {
            color: darkred;
        }

        header {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Encabezado principal</h1>
        <h2>Subtítulo sencillo</h2>
        <h3>Título más pequeño</h3>
    </header>

    <p>Este ejemplo muestra cómo dar estilo simple a los headers usando colores básicos y un borde muy fácil de explicar.</p>
</body>
</html>
