<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Size</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="titulo-grande">Ejemplos de font-size</h1>

    <p class="texto-pequeno">Este texto usa un tamaño pequeño.</p>
    <p class="texto-mediano">Este texto usa un tamaño mediano.</p>
    <p class="texto-grande">Este texto usa un tamaño grande.</p>
    <p class="texto-rem">Este texto usa rem para cambiar el tamaño.</p>
    <p class="texto-porcentaje">Este texto usa porcentaje en el tamaño.</p>

    <div class="caja">
        <p class="texto-em">Este texto usa em dentro de una caja.</p>
    </div>
</body>
</html>
