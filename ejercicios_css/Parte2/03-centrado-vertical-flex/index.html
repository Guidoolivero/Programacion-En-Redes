<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3. Centrado vertical con Flex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Centrado vertical — caja flex</h1>
  <p class="nota">
    El padre es flex. <code>justify-content: center</code> centra en horizontal.
    <code>align-items: center</code> centra en vertical.
    La caja hija queda en el medio, sin importar el tamaño.
  </p>

  <div class="padre">
    <div class="caja">estoy en el centro</div>
  </div>
</body>
</html>
