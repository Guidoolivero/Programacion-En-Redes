<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6. Tabla RWD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tabla responsive</h1>
  <p class="nota">
    En desktop se ve la tabla normal.
    En celular el contenedor tiene <code>overflow-x: auto</code>:
    la tabla no se rompe, se scrollea de costado.
  </p>

  <div class="envoltorio">
    <table>
      <thead>
        <tr>
          <th>Producto</th>
          <th>Stock</th>
          <th>Precio</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Café</td>
          <td>12</td>
          <td>$4500</td>
          <td>Bebidas</td>
        </tr>
        <tr>
          <td>Medialuna</td>
          <td>30</td>
          <td>$1200</td>
          <td>Panadería</td>
        </tr>
        <tr>
          <td>Jugo</td>
          <td>8</td>
          <td>$2800</td>
          <td>Bebidas</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
