<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JS04_alcance.html</title>
  <style>
    body { font-family: "Times New Roman", Times, serif; margin: 16px; }
    h2 { font-size: 24px; margin-bottom: 16px; }
    .botones { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
    }
  </style>

<body>
  <h2>Asignaremos valor a la variable global desde adentro de una función:</h2>

  <div class="botones">

    <button type="button" onclick="asignacionForzadaSinDeclaracion()">Asignacion forzada sin declaración</button>
    <button type="button" onclick="mostrarVariableGlobal()">Muestra variable global</button>
  </div>

  <script src="alcance.js"></script>
