<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Acceso al Sistema — Formulario de Login</title>
  <link rel="stylesheet" href="estiloLogin.css">
</head>
<body>
  <!-- Botón para regresar al menú global de ejercicios de la materia -->
  <a class="btn-volver" href="../index.php">Volver al menú</a>

  <div class="contenedor-card">
    <h2>Ingreso al Sistema</h2>
    <p class="subtitulo">Manejo de Sesión y Clave Encriptada con SHA-256</p>

    <!-- 
      Formulario de Login desprotegido (Págs. 1, 2, 4 del apunte).
      Envía las credenciales vía POST a ingresoAlSistema.php
    -->
    <form action="ingresoAlSistema.php" method="POST" id="formLogin">
      <div class="campo">
        <label for="login">Usuario / Login:</label>
        <input type="text" name="login" id="login" placeholder="Ej: admin o guido" required autofocus>
      </div>

      <div class="campo">
        <label for="password">Contraseña:</label>
        <input type="password" name="password" id="password" placeholder="Contraseña" required>
      </div>

      <button type="submit" id="btnIngresar" class="btn-principal">Ingresar al Sistema</button>
    </form>

    <div class="ayuda-credenciales">
      <p><b>Usuarios de prueba:</b></p>
      <p>Usuario: <code>admin</code> | Clave: <code>admin123</code></p>
      <p>Usuario: <code>guido</code> | Clave: <code>guido123</code></p>
      <p style="font-size: 11px; color: #666; margin-top: 6px;">
        (Si es la primera vez que ingresas, ejecuta <a href="seedUsuario.php">seedUsuario.php</a> para cargar los hashes en la tabla <code>usuarios</code>).
      </p>
    </div>
  </div>
</body>
</html>
